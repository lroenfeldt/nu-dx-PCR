<!DOCTYPE html>
<head>
    <style>
        body {
            height: 300px; 
            width: 500px; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            background-color: rgb(1, 21, 60);
            overflow: hidden;
            font-family: sans-serif;
            color: white;
        }
        body::after {
            content: '';
            position: absolute;
            height: 120%;
            width: 60%;
            left: -15%;
            top: -25%;
            background-image: url('./logo_large.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: -1;
            opacity: 0.1;
        }

        .title {
            display: flex;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 10px 0 0;
            padding: 0;
        }
        #versionNumber {
            margin-bottom: 5px;
        }
        .procomcure {
            max-height: 40px;
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>
<html lang="en">
  <body>
      <div class="title">
        <h1 style="color:white"><span style="font-weight: 500">PhoenixDx®</span> <span style="font-weight: 200">POC</span></h1>
        <span id="versionNumber">Test</span>
      </div>
      <div class="updateStatus">
          <span id="updateMessage">Initializing...</span>
      </div>
      <img class="procomcure" src="./procomcure.png" alt="logo">
  </body>

  <script>
      const getVersion = async () => {
          const version = await window.api.getVersion()
          const versionElement = document.getElementById('versionNumber')
          versionElement.innerText = 'v' + version
      }
      getVersion()

      window.api.updateStatus((event, message) => {
        const messageElement = document.getElementById('updateMessage')
        messageElement.innerText = message 
      })

  </script>
</html>
