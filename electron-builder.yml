appId: com.electron.nu-dx-pcr
productName: nu:dx PCR
asar: true
directories:
  output: "release/${version}"
files:
  - dist-electron
  - dist
mac:
  artifactName: "${productName}_${version}.${ext}"
  target:
    - dmg
    - zip
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: "icon.png"
  artifactName: "${productName}_${version}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  channel: latest
  releaseType: release
  private: true
  token: ${env.VITE_APP_GH_TOKEN}