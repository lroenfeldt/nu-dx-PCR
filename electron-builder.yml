appId: com.electron.nu-dx-pcr
productName: nu:dx PCR
directories:
  buildResources: public
files:
  - dist-electron
  - dist
mac:
  artifactName: "${productName}_${version}.${ext}"
  target:
    - dmg
    - zip
win:
  target: nsis
  icon: "icon.png"

publish:
  provider: github
  channel: latest
  releaseType: release
  private: true
  token: ${env.VITE_APP_GH_TOKEN}